<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MySKD</title>
<link rel="icon" type="image/png" href="/logo-192.png">
<link rel="apple-touch-icon" href="/logo-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#c40000">
<style>
:root{--bg:#fdf4f4;--c:#fff;--tx:#1f2937;--mu:#6b7280;--p:#c40000;--b:#ead6d6;--bl:#e30613;--y:#f59e0b;--g:#f3e7e7;--ok:#16a34a;--no:#c40000;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 'Segoe UI',system-ui,sans-serif}
header{background:var(--p);color:#fff;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
header nav{display:flex;gap:6px;flex-wrap:wrap}header a,.btn{cursor:pointer;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;background:var(--bl);color:#fff}
header a{background:rgba(255,255,255,.15)}header a.on{background:#fff;color:var(--p)}
main{max-width:1000px;margin:0 auto;padding:14px}.card{background:var(--c);border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
h2,h3{margin:0 0 10px}input,select,textarea{width:100%;padding:10px;margin:4px 0 10px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--tx);font:inherit}
.btn.y{background:#ca8a04}.btn.r{background:var(--no)}.btn.g{background:var(--g);color:var(--tx)}.btn.ok{background:var(--ok);color:#fff}.btn.y,.btn.r{color:#fff}.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;padding:10px;border:1px solid var(--b);border-radius:10px;background:var(--c);color:var(--tx);font:inherit;font-weight:700;cursor:pointer}.tabs .on{background:var(--bl);color:#fff;border-color:var(--bl)}details{border:1px solid var(--b);border-radius:10px;padding:10px 12px;margin:8px 0}summary{font-weight:700;cursor:pointer}details ul{margin:8px 0;padding-left:20px}.back{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:8px;padding:8px 12px;font:inherit;font-weight:600;cursor:pointer;margin-right:10px}.nv .grid{max-height:260px;overflow:auto}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}.mu{color:var(--mu);font-size:13px}
.stat{text-align:center;padding:10px;border-radius:10px;background:var(--bg)}.stat b{display:block;font-size:24px}
.ok{color:var(--ok)}.no{color:var(--no)}.tag{display:inline-block;padding:2px 10px;border-radius:99px;background:#dbeafe;color:#1e40af;font-size:12px;font-weight:700}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--b);background:var(--c);color:var(--tx);border-radius:10px;padding:10px 12px;margin:8px 0;cursor:pointer;font:inherit}.opt.s{border-color:var(--bl);background:rgba(37,99,235,.15)}
.ex{display:flex;gap:14px;flex-wrap:wrap}.ex .q{flex:3;min-width:280px}.ex .nv{flex:1;min-width:220px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.grid button{height:38px;border-radius:8px;border:1px solid var(--b);background:var(--g);color:var(--tx);font-weight:700;cursor:pointer}
.grid .a{background:var(--bl);color:#fff}.grid .d{background:var(--y);color:#111}.grid .cur{outline:3px solid #93c5fd}
.tm{font:700 20px monospace;color:var(--y)}.trik{background:rgba(250,204,21,.18);border-left:4px solid var(--y);padding:8px 12px;border-radius:6px;margin-top:8px}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{padding:6px 8px;border-bottom:1px solid var(--b);text-align:left;font-size:14px}
.bar{display:flex;justify-content:space-between;gap:8px;margin-top:14px}
/* ===== v7: tema merah-putih + menu bawah ===== */
header{background:linear-gradient(135deg,#e30613,#b30000);box-shadow:0 2px 12px rgba(160,0,0,.25);position:relative;padding:18px 16px 20px;border-radius:0 0 22px 22px}
header nav{display:none!important}
.card{border-radius:16px}
.tag{background:#fde4e4;color:#b30000}.opt.s{background:rgba(227,6,19,.08)}.grid .cur{outline:3px solid #fca5a5}
.tm{color:#fff}.btn.ok{background:var(--bl)}.btn.r{background:#fff;color:var(--no);border:2px solid var(--no)}.btn.y{background:#f59e0b}
.chip.on{background:var(--bl);border-color:var(--bl);color:#fff}
.hd .lg,.lg{box-shadow:0 0 0 2px rgba(255,255,255,.9)}
.out{position:absolute;top:14px;right:14px;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
body.hasnav{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
#bnav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;background:#fff;border-top:1px solid #f0dcdc;box-shadow:0 -4px 16px rgba(120,0,0,.12);padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px))}
#bnav button{flex:1;min-height:60px;border:0;background:none;color:#7b808a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
#bnav i{display:flex;width:54px;height:32px;align-items:center;justify-content:center;border-radius:16px}
#bnav button.on{color:var(--bl)}#bnav button.on i{background:#fde4e4}
#bnav button[data-n=Ujian] i{background:var(--bl);color:#fff}#bnav button[data-n=Ujian]{color:var(--bl)}
.qk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 14px}
.qk button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;font:inherit;font-size:13px;font-weight:700;color:var(--tx);cursor:pointer;padding:4px 0}
.qk i{width:62px;height:62px;border-radius:50%;background:#fff;color:var(--bl);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(180,0,0,.18)}
.qk button:first-child i{background:var(--bl);color:#fff}
</style></head><body>
<div id="app"><div id="boot" style="font:16px sans-serif;padding:40px 16px;text-align:center;color:#9ca3af">Memuat aplikasi…<br><small id="bootmsg"></small></div></div>
<script>
window.__errs=[];addEventListener('error',function(e){window.__errs.push(e.message+' @'+(e.lineno||'?'));var m=document.getElementById('bootmsg');if(m)m.textContent='Error: '+window.__errs.join(' | ')});

window.__lg=['halaman dibuka'];window.__log=function(m){window.__lg.push(m)};
(function(){var F=window.fetch;window.fetch=function(u,o){__log('minta '+u);var c=new AbortController(),t=setTimeout(function(){c.abort()},15000);o=Object.assign({},o||{},{signal:c.signal});return F.call(window,u,o).then(function(r){clearTimeout(t);__log(u+' = '+r.status);return r},function(e){clearTimeout(t);__log(u+' gagal: '+(e&&e.name));throw e})}})();
setTimeout(function(){var b=document.getElementById('boot');if(b){b.innerHTML='Aplikasi gagal dimuat.<br><small>'+(window.__errs.join(' | ')||'Tidak ada error.')+'<br>Catatan: '+window.__lg.join(' → ')+'</small><br><br><button onclick="location.reload()" style="padding:10px 18px;font-size:16px">Muat Ulang</button>'}},6000);
</script>
<script src="app1.js?v=7"></script>
<script src="app2.js?v=7"></script>
<script src="app3.js?v=7"></script>

</body></html>
